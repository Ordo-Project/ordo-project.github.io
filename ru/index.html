      <div style="max-width: 760px; margin: 0 auto; padding: 48px 24px; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>Ordo Research Lab — перезаписываемая память модели и предел длинного контекста</h1>
        <p>
          Ordo — независимая исследовательская лаборатория. Ведущий исследователь: Russel Gavery (Гаврилов Руслан,
          @8hrsk). Цель — локальный ассистент, который принимает новую версию документации дельтой, а не переобучением,
          и честно знает, какая часть его окна контекста работает.
        </p>
        <h2>Простыми словами</h2>
        <p>
          Знание языковой модели заморожено на момент обучения. Как только выходит новая версия библиотеки или меняется
          внутренний регламент, модель уверенно отвечает неправильно, а штатный способ починить — обучать заново: дорого
          и разрушительно, дообучение равной ёмкости при одной правке портит 8.4% несвязанных фактов. Ordo держит факты
          в перезаписываемом хранилище, из которого читает замороженная модель, поэтому обновление — это небольшая
          запись, а не прогон обучения. Отсюда две выгоды. Компания может держать локального ассистента актуальным по
          своей закрытой документации, не обращаясь к вендору. А вендор модели или агента может поставлять обновления
          знаний отдельно от модели и в своём темпе: кодовый ассистент несёт актуальное знание популярных библиотек в
          самой модели, вместо того чтобы каждый клиент поднимал у себя RAG или MCP-серверы.
        </p>
        <h2>Ordo-M — обновляемая внешняя память</h2>
        <p>
          К замороженной модели приделывается таблица значений, адресуемая из текста; веса базы остаются побитово теми
          же. Точечная правка даёт 0.0% побочного ущерба против 8.4% у LoRA равной ёмкости. На настоящем кодовом домене
          память взяла планку, которую сама себе поставила против поиска: 68.1% против порога 67.8% — но только после
          того, как корпус переписали в ту форму, о которой спрашивают. На сыром тексте документации выходит 54.1%, и
          заведомо неверный адрес даёт ровно столько же, сколько верный.
        </p>
        <h2>OrdoGen — функциональный предел длинного контекста</h2>
        <p>
          В пределах родного окна небольшой модели буквальное извлечение падает с 70/70 на 16K токенов до 56/70 на 32K,
          а на 128K и обычные промпты, и лучшее промпт-уровневое вмешательство дают 0/15. Причина доведена причинно до
          трёх голов внимания в одном позднем слое.
        </p>

          <a href="mailto:founder@ordo-project.com">founder@ordo-project.com</a>.
        </p>
