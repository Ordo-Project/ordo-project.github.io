      <div style="max-width: 760px; margin: 0 auto; padding: 48px 24px; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>Ordo Research Lab — rewritable memory for frozen LLMs, and the limit of long context</h1>
        <p>
          Ordo is an independent research lab led by Russel Gavery (Gavrilov Ruslan, @8hrsk). Its goal is a locally
          hosted assistant that accepts a new version of a documentation set as a diff instead of being retrained, and
          that is honest about how much of its context window actually works.
        </p>
        <h2>Ordo-M — rewritable external memory</h2>
        <p>
          A value table addressed from text is attached to a frozen model, leaving the base weights bit-identical. A
          point edit causes 0.0% collateral damage, against 8.4% for an equal-capacity LoRA. On a real code domain the
          memory has passed the bar it set for itself against retrieval, 68.1% against a 67.8% threshold, but only after
          the corpus was rewritten into the form the questions ask about: fed raw documentation text it scores 54.1%,
          and a deliberately wrong address scores the same as the right one.
        </p>
        <h2>OrdoGen — the functional limit of long context</h2>
        <p>
          Within a small model's native position limit, literal retrieval falls from 70/70 at 16K tokens to 56/70 at
          32K, and at 128K both plain prompts and the best prompt-level intervention score 0/15. The failure is
          localized causally to three attention heads in a single late layer.
        </p>
        <p>
          Methods, measurements and negative results are published in English and Russian; source code and evaluation
          harnesses are closed. See <a href="https://x.com/ordoproject">@ordoproject</a> and
          <a href="https://github.com/8hrsk">github.com/8hrsk</a>.
        </p>
      </div>
